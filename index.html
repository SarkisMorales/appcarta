<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- PARA-COMPARTIR: lo completa solo el editor al guardar (nombre, foto y descripción que se ven al pasar el link por WhatsApp) -->
  <title>MORFI - CLUB · Carta</title>
  <meta name="description" content="Cafetería · Comida Rapida · Mendoza. Mirá la carta con fotos y precios actualizados, y las ofertas del día.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_AR">
  <meta property="og:site_name" content="MORFI - CLUB">
  <meta property="og:title" content="MORFI - CLUB · Carta">
  <meta property="og:description" content="Cafetería · Comida Rapida · Mendoza. Mirá la carta con fotos y precios actualizados, y las ofertas del día.">
  <meta property="og:url" content="https://sarkismorales.github.io/appcarta/">
  <meta property="og:image" content="https://sarkismorales.github.io/appcarta/fotos/compartir.jpg?v=42b3b282">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="MORFI - CLUB">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" as="image" href="fotos/portada.webp" fetchpriority="high">
  <!-- /PARA-COMPARTIR -->
  <script>
    // Pide el menú apenas abre la página, en paralelo con lo demás (la carta aparece antes).
    window.cartaMenu = window.fetch && fetch("menu.json", { cache: "no-cache" });
  </script>
  <meta name="theme-color" content="#2B1408">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23502314'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23FFF8F0' font-family='Arial' font-weight='bold'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="portada" id="portada">
    <div class="portada-foto" id="portada-foto"></div>
    <div class="portada-acciones" id="portada-acciones"></div>
    <div class="portada-marca">
      <div class="logo" id="logo" aria-hidden="true"></div>
      <div class="portada-titulos">
        <h1 id="nombre-negocio">Carta</h1>
        <p id="subtitulo" class="subtitulo"></p>
      </div>
    </div>
    <ul class="datos-negocio" id="datos-negocio"></ul>
  </header>

  <nav class="nav" id="nav" aria-label="Categorías">
    <div class="nav-fila">
      <button class="nav-buscar" id="abrir-buscador" type="button" aria-label="Buscar en la carta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <div class="pildoras" id="pildoras"></div>
    </div>
    <div class="buscador" id="buscador" hidden>
      <input id="buscar" type="search" placeholder="¿Qué tenés ganas de comer?" autocomplete="off" aria-label="Buscar en la carta">
      <button id="cerrar-buscador" type="button">Cancelar</button>
    </div>
  </nav>

  <main id="carta" class="carta">
    <p class="cargando">Cargando carta…</p>
  </main>

  <footer class="pie" id="pie"></footer>

  <div class="barra-pedido" id="barra-pedido" hidden>
    <button class="barra-boton" id="ver-pedido" type="button"></button>
  </div>

  <div class="hoja" id="hoja" hidden>
    <div class="hoja-fondo" data-cerrar="1"></div>
    <div class="hoja-caja" id="hoja-caja" role="dialog" aria-modal="true" tabindex="-1"></div>
  </div>

  <div class="aviso-flotante" id="aviso-flotante" role="status" aria-live="polite"></div>

  <script src="carta.js" defer></script>
</body>
</html>
